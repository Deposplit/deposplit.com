version = 3.11.5
runner.dialect = scala3

maxColumn = 120

# Keep each file's existing line endings instead of normalising to LF. Without this,
# scalafmt rewrites a Windows checkout (core.autocrlf gives CRLF working trees) to LF,
# and every formatted file then shows as modified in git status while git diff shows
# nothing -- noise that has twice been mistaken for a stray reformat. What is committed
# is unaffected either way: git normalises to LF in the repository regardless.
lineEndings = preserve
