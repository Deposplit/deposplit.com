name: Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  # Weekly as well, so a change to the runner image or the toolchain shows up on a Monday rather
  # than on whichever push comes next.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  # The event is part of the group so that the Monday run and a push to main never cancel each
  # other. A cancelled push run would also mean no deploy, since Deploy follows push runs only.
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sbt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'sbt'
    - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
    - name: Check formatting
      run: sbt scalafmtCheckAll scalafmtSbtCheck
    - name: Test with sbt
      run: sbt test
