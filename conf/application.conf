# DB configuration

db.default.driver = org.postgresql.Driver
# Assembled from the add-on's parts rather than taken from POSTGRESQL_ADDON_URI: Play rewrites only a postgres:// URI
# into a JDBC one, and passes any other form to the driver as is.
db.default.url = "jdbc:postgresql://"${?POSTGRESQL_ADDON_HOST}":"${?POSTGRESQL_ADDON_PORT}"/"${?POSTGRESQL_ADDON_DB}
db.default.username = ${?POSTGRESQL_ADDON_USER}
db.default.password = ${?POSTGRESQL_ADDON_PASSWORD}

# https://www.playframework.com/documentation/latest/Evolutions#Evolutions-configuration
# Ups only: autoApplyDowns stays off, so an edited 1.sql stops production from starting instead of dropping its tables.
play.evolutions.db.default.autoApply = true

# https://www.playframework.com/documentation/latest/AccessingAnSQLDatabase#Using-a-CustomExecutionContext
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 10 # ${db.default.hikaricp.maximumPoolSize}
  }
}


# relay row retention (see jobs.RetentionSweep and "Absence is never a signal" in docs/protocol.md)

relay.retention.enabled = true
relay.retention.sweep-interval = 12 hours
# How long a heartbeat may go unread and unrefreshed - every push refreshes it - before it expires. Never less than the
# apps' loss threshold of 9 days: a heartbeat that old would mark its holder lost anyway, so expiring it changes nothing
# the owner concludes, whereas expiring a younger one could make a live holder look lost to an owner offline for a week.
relay.retention.custody-heartbeats = 28 days
# How long a rotation notice waits for its recipient. Generous, because a rotation is sent once and can never be sent
# again - the old signing key is gone once the new identity is active - so expiring an unread one leaves that contact to
# be relinked in person. The rotating device's awaiting relink nudge shows who.
relay.retention.key-rotations = 180 days
# How long a share request waits for whoever has to act on it next, counted from its last change - the answer if there is
# one, the request otherwise. A pending deposit carries the only copy of a share in transit, but a holder who has not
# picked it up by then never counted toward the owner's redundancy, so expiring it changes nothing she believes.
relay.retention.share-requests = 28 days


# i18n/l10n configuration

play.i18n.langs = ["en", "de"]
play.filters.enabled += filters.LocaleFilter


# security configuration

play.http.secret.key = ${?APPLICATION_SECRET}

# Clever Cloud ends TLS at its reverse proxy, so without trusting the proxy's X-Forwarded-Proto every request looks
# insecure. Trusting every address rather than CC_REVERSE_PROXY_IPS, a comma-separated string HOCON cannot turn into a
# list: the relay decides nothing by a client's address and never writes one down, and a spoofed header only changes the
# redirect its sender gets back.
play.http.forwarded.trustedProxies = ["0.0.0.0/0", "::/0"]

# Redirects only in production, where Clever Cloud's force-HTTPS has already redirected, so what it adds there is HSTS.
play.filters.enabled += play.filters.https.RedirectHttpsFilter

play.filters.enabled += play.filters.csp.CSPFilter
play.filters.csp.directives.default-src = "'none'"
play.filters.csp.directives.connect-src = "'self'"
play.filters.csp.directives.font-src = "'self'"
play.filters.csp.directives.frame-ancestors = "'none'"
play.filters.csp.directives.frame-src = "'self'"
play.filters.csp.directives.img-src = "'self'"
play.filters.csp.directives.manifest-src = "'self'"
play.filters.csp.directives.script-src = "'self'"
play.filters.csp.directives.style-src = "'self'"

play.filters.hosts.allowed = [".deposplit.com", ${?PAAS_DOMAIN}]

# security-ish
play.filters.enabled += filters.ApiHostPathFilter
