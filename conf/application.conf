# DB configuration

db.default.driver = org.postgresql.Driver
db.default.url = ${?POSTGRESQL_URI}

# https://www.playframework.com/documentation/latest/AccessingAnSQLDatabase#Using-a-CustomExecutionContext
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 10 # ${db.default.hikaricp.maximumPoolSize}
  }
}


# relay row retention (see jobs.RetentionSweep and "Absence is never a signal" in docs/protocol.md)

relay.retention.enabled = true
relay.retention.sweep-interval = 12 hours
# How long a heartbeat may go unread and unrefreshed - every push refreshes it - before it expires. Never less than the
# apps' loss threshold of 9 days: a heartbeat that old would mark its holder lost anyway, so expiring it changes nothing
# the owner concludes, whereas expiring a younger one could make a live holder look lost to an owner offline for a week.
relay.retention.custody-heartbeats = 28 days
# How long a rotation notice waits for its recipient. Generous, because a rotation is sent once and can never be sent
# again - the old signing key is gone once the new identity is active - so expiring an unread one leaves that contact to
# be relinked in person. The rotating device's awaiting relink nudge shows who.
relay.retention.key-rotations = 180 days


# i18n/l10n configuration

play.i18n.langs = ["en", "de"]
play.filters.enabled += filters.LocaleFilter


# security configuration

play.filters.csp.directives.default-src = "'none'"
play.filters.csp.directives.connect-src = "'self'"
play.filters.csp.directives.font-src = "'self'"
play.filters.csp.directives.frame-ancestors = "'none'"
play.filters.csp.directives.frame-src = "'self'"
play.filters.csp.directives.img-src = "'self'"
play.filters.csp.directives.manifest-src = "'self'"
play.filters.csp.directives.script-src = "'self'"
play.filters.csp.directives.style-src = "'self'"

play.filters.hosts.allowed = [".deposplit.com", ${?PAAS_DOMAIN}]

# security-ish
play.filters.enabled += filters.ApiHostPathFilter
