include "localhost"

db.default.url = "jdbc:h2:mem:play;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE"
play.evolutions.db.default.autoApply = true

# Play's FakeRequest uses "localhost" (no port) as the default Host header
play.filters.hosts.allowed = ["localhost"]

# No sweeps on a timer: the specs call RetentionSweep.sweep() themselves, when they mean to.
relay.retention.enabled = false

# Tests exercise the production router, not the development one - so that a
# route reachable in a test is a route reachable in production.
play.http.router = "router.Routes"
