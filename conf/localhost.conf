include "application"

db.default.driver = org.h2.Driver
db.default.url = "jdbc:h2:./.devDBs/deposplit;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE"
# db.default.driver = org.postgresql.Driver
# db.default.url = "postgresql://PSuser:PSpassword@localhost:5432/PSuser"

# iOS Simulator uses localhost (or 127.0.0.1) and so does the browser
# Android Emulator uses 10.0.2.2 (https://developer.android.com/studio/run/emulator-networking-address)
play.filters.hosts.allowed = ["localhost", "127.0.0.1", "10.0.2.2"]

# ApiHostPathFilter's api./www. host split is a production DNS concern; local dev/test (phon emulator, sbt test) has
# no such split, so the filter is disabled here rather than routing every local request through an api.localhost host.
play.filters.disabled += filters.ApiHostPathFilter

# https://www.playframework.com/documentation/latest/ScalaDependencyInjection#Programmatic-bindings
play.modules.enabled += "PhonModule"

# The phon emulator is mounted only by the development router (conf/dev.routes);
# the production router has no phon routes at all.
play.http.router = "dev.Routes"
