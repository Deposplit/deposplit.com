openapi: "3.0.3"

info:
  title: Deposplit API
  version: "0.1"
  description: |
    REST API for the Deposplit secret-sharing Web app/service.

    ## Authentication

    Every request must carry three headers:

    | Header | Content |
    |---|---|
    | `X-Deposplit-Verify-Key` | Caller's public verify key (base64url — see `PublicKey` schema) |
    | `X-Deposplit-Nonce` | Per-request unique string in the form `<unix-ms>.<random>` — server rejects requests whose embedded timestamp is more than 5 minutes old |
    | `X-Deposplit-Signature` | Base64url signature under the caller's cipher suite (see `CipherSuite`) |

    The signature covers the canonical string:

    ```
    nonce || "\n" || UPPERCASE(method) || "\n" || path_with_query || "\n" || hex(SHA-256(body))
    ```

    where `body` is the empty string for requests without a body.
    The Web app/service verifies the signature against the verify key supplied in `X-Deposplit-Verify-Key`.
    No pre-registration is required — the keypair is the identity.

    ## Timestamps

    Every timestamp in a body, request or response, is an RFC 3339 instant in UTC with exactly
    three fractional digits: `2026-01-01T00:00:00.123Z`. Milliseconds are the precision every
    signature covers, and the only one Deposplit keeps. The relay writes exactly this form, and
    reads any number of fractional digits from none to nine, cut to the millisecond. Clients are
    expected to do the same.

    ## Payload signatures

    Two additional digital signatures ride with every `ShareRequest` row, independent of the
    transport-auth signature above. The transport signature authenticates the HTTP caller for one
    specific call and is never persisted — it gives a later reader of a row (via `GET`) nothing to
    re-verify authorship against. `senderSignature` and `recipientSignature` close that gap: any
    holder of the author's public verify key can independently re-verify who authored a row,
    regardless of which relay served it. This is what makes BYOR (routing a contact's shares
    through a relay other than deposplit.com, e.g. a self-hosted instance) safe — a passive
    third-party relay performs no verification of its own, so recipients verify client-side
    instead.

    `senderSignature` (required on every `POST /share-requests`) is a digital signature by the
    caller (who becomes `senderKey`) over:

    ```
    secretId || "\n" || transactionType || "\n" || recipientKey(base64url) || "\n" || base64-standard(sealedLabel) || "\n"
      || epochMillis(secretCreatedAt) || "\n" || (base64-standard(ciphertext) or "")
      || "\n" || (k or "") || "\n" || (n or "") || "\n" || (mimeType or "")
    ```

    `recipientSignature` (required on every `PATCH /share-requests/{requestId}`, including
    denials) is a digital signature by the caller (who must be `recipientKey`) over:

    ```
    requestId || "\n" || ("approved" or "denied") || "\n" || (base64-standard(ciphertext) or "")
    ```

    `secretCreatedAt` is signed as epoch milliseconds (not the ISO-8601 wire string) and UUIDs are
    signed lowercase — both choices exist solely to keep the signed bytes identical across
    independently-implemented clients. Verification rebuilds the signed bytes from the timestamp
    as parsed, so the wire string has to carry the very milliseconds signed (see Timestamps
    above). Both signatures are base64url-encoded (no padding) on the wire, matching
    `X-Deposplit-Signature`. The Web app/service also verifies both server-side as
    defense-in-depth, rejecting with `400` if they don't verify — recipients should not rely on
    this for relays other than deposplit.com, since a passive third-party relay cannot perform it.

    `signature` on a `POST /key-rotations` push follows the same pattern: a digital signature
    by the caller (who becomes `oldVerifyKey`) over:

    ```
    recipientKey(base64url) || "\n" || newVerifyKey(base64url) || "\n" || newEncKey(base64url) || "\n" || newCipherSuite
    ```

    proving the caller still controls the old private key — this is what lets the recipient
    auto-accept the rotation without a fresh human re-verification. `newCipherSuite` is the
    "crypto agility") is the signing + key-agreement algorithm pairing `newVerifyKey`/`newEncKey`
    use; there is no `oldCipherSuite` field, since the recipient already has it pinned on the
    existing contact record being rotated away from.

    `signature` on a `POST /custody-heartbeats` push follows the same pattern: a
    digital signature by the caller (who becomes `holderKey`) over:

    ```
    ownerKey(base64url) || "\n" || sortedSecretIds(comma-joined, lowercase) || "\n" || optedOut("true"|"false") || "\n" || emittedAt(epoch ms)
    ```

    `emittedAt` is the holder's own clock at signing; it travels as an ISO-8601 instant with its
    milliseconds intact, and the owner dates custody from it. A heartbeat is a message like any
    other: the owner deletes it once read (`DELETE /custody-heartbeats/{id}`), keeping what it
    told her on her own device, and the holder re-emits every interval. Until it is read, a newer
    push from the same holder to the same owner replaces it, under a fresh `id`. The same
    construction covers the signed opt-out notice (`optedOut: true`, `secretIds` typically empty)
    — mechanically the same push, different meaning to the reader.

    ## Key exchange

    Contacts exchange public keys out-of-band (QR code scanned in person, or a link shared
    via a third-party app such as Signal or Threema). The Web app/service never stores or resolves
    user identities; it routes deposits and consent requests by verify key only (see `PublicKey`).

    The QR code / share link carries both keys plus the cipher suite they use (see `CipherSuite`):
    - **Verify key** — used for API authentication and as the routing identity on the server
      (Ed25519, for the current cipher suite `ed25519+x25519-v1`)
    - **Encryption key** — used by the sender to encrypt shares client-side
      (X25519+HKDF-SHA-256+ChaCha20-Poly1305, for the current cipher suite)

    The server never sees encryption keys.

    ## Unified consent model

    Three of the five share operations are modelled as consent requests:

    | Type | Direction | Initiator | Consent required from |
    |---|---|---|---|
    | `deposit` | Alice deposits → Bob receives | Alice (sender) | Bob (recipient) |
    | `retrieval` | Bob sends back → Alice receives | Alice (sender) | Bob (recipient) |
    | `removal` | Bob deletes locally | Alice (sender) | Bob (recipient) |

    Every request of these three types starts in state `pending`; the recipient approves or
    denies via `PATCH`.

    The other two, `inventory` and `withdrawal`, are **not** consent-gated — see their descriptions
    under `ShareTransactionType` below. They self-approve at creation; there is no `PATCH` phase for
    them.

    Every row is a message, deleted by the party it is addressed to once acted on: an approved
    `deposit` by its sender as soon as she has seen the pickup, an answered `retrieval` or
    `removal` by its sender, a push by its recipient. Deleting a row deletes that row alone.

    ## Binary encoding

    - **Public key fields** (`senderKey`, `recipientKey`) use **base64url encoding without padding**,
      matching the `X-Deposplit-Verify-Key` auth header.
    - **`ciphertext`** uses **standard base64 encoding with padding** (`format: byte`).

    ## Notifications

    Clients poll for pending events on app open and periodically while foregrounded:
    `GET /share-requests?role=recipient&state=pending`, etc.
    Background push (FCM/APNs) is not part of v0.1.

servers:
  - url: https://api.deposplit.com

security:
  - ed25519Auth: []

components:

  securitySchemes:
    ed25519Auth:
      type: apiKey
      in: header
      name: X-Deposplit-Signature
      description: >
        Must accompany X-Deposplit-Verify-Key and X-Deposplit-Nonce headers.
        See top-level description for the canonical signing string.

  schemas:

    SecretId:
      type: string
      format: uuid
      description: UUID generated by the sender at split time; shared across all n shares of a secret.

    PublicKey:
      type: string
      description: >
        Base64url-encoded signing-algorithm public key (32 bytes, no padding, for the current
        cipher suite `ed25519+x25519-v1` — see `CipherSuite`) — used for API authentication and as
        the routing identity. Not pinned to an exact length; a future cipher suite may use a
        different key size.

    CipherSuite:
      type: string
      enum: [ed25519+x25519-v1]
      description: >
        The matched pairing of signing algorithm + key-agreement algorithm an identity currently
        uses. One value exists
        today; the type exists so a future fleet-wide algorithm swap is an additive new value
        rather than a breaking wire-format migration.

    ShareTransactionType:
      type: string
      enum: [deposit, retrieval, removal, inventory, withdrawal]
      description: >
        `deposit`   — sender deposits an encrypted share for the recipient to approve and collect.
        `retrieval` — sender wants the share bytes back from the recipient (requires approval + ciphertext).
        `removal`   — sender wants the recipient to delete their local copy (requires approval).
        `inventory` — a holder pushes a metadata-only report about a share of theirs back
        to its owner, so a recovering owner (fresh device, empty local state) can rebuild their
        records after losing their old identity's key.
        Unlike the three above, this is **not** consent-gated: it self-approves at
        creation (no `pending` phase), never carries `ciphertext`, and requires `k`/`n`/`mimeType`.
        The recipient polls for it and deletes the row once consumed.
        `withdrawal` — a holder tells the owner, signed, that they have stopped holding a share.
        Self-approved like `inventory`, but carries no `ciphertext`, `k`, `n` or `mimeType`. The
        recipient polls for it, drops that holder for that secret, and deletes the row once
        consumed.

    ShareRequestState:
      type: string
      enum: [pending, approved, denied]

    ShareRequest:
      description: >
        A self-describing share request row. All five transaction types (deposit, retrieval,
        removal, inventory, withdrawal) use the same flat structure. `ciphertext`, `k`, `n`, and `mimeType`
        semantics depend on `transactionType` — see field descriptions.
      type: object
      required: [id, secretId, senderKey, recipientKey, sealedLabel, secretCreatedAt, transactionType, state, requestedAt, senderSignature]
      properties:
        id:
          type: string
          format: uuid
        secretId:
          $ref: '#/components/schemas/SecretId'
        senderKey:
          $ref: '#/components/schemas/PublicKey'
        recipientKey:
          $ref: '#/components/schemas/PublicKey'
        sealedLabel:
          type: string
          format: byte
          description: >
            Standard base64. The secret's label, sealed by the sender to the recipient's encryption
            key with the same box as a share, so the relay cannot read it. Only the recipient opens it,
            to show it.
        secretCreatedAt:
          type: string
          format: date-time
          description: Client-supplied timestamp of when the secret was created on the sender's device.
        transactionType:
          $ref: '#/components/schemas/ShareTransactionType'
        state:
          $ref: '#/components/schemas/ShareRequestState'
        requestedAt:
          type: string
          format: date-time
          description: >
            When the request was opened. A request nobody answers is deleted by the relay once this
            is older than its retention period, 28 days by default — a pending deposit included.
        respondedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Set when the recipient responds via PATCH. For `inventory` and `withdrawal` this is set
            immediately at creation (self-approved, no PATCH phase). Once set, it is what expiry
            counts from: an answered request is deleted once this is older than the retention
            period, 28 days by default.
        ciphertext:
          type: string
          format: byte
          nullable: true
          maxLength: 524288
          description: >
            At most 512 KiB decoded; a larger one is refused with 413. Semantics differ by type:

            `deposit`: populated by the sender at creation (opaque encrypted share bytes);
            delivered to the recipient in the PATCH response on approval and cleared from the relay.
            Not returned on GET after delivery. The sender deletes the approved row once she has
            seen it.

            `retrieval`: absent at creation; supplied by the recipient in the PATCH body on approval;
            stored temporarily until the sender collects it via GET.

            `removal`: always null.

            `inventory`: always null — this type never carries share bytes.

            `withdrawal`: always null.
        k:
          type: integer
          nullable: true
          description: >
            SSS threshold. Populated for `deposit` and `inventory` (required, `2 <= k <= n
            <= 255`); `null` for `retrieval`/`removal`/`withdrawal`.
        n:
          type: integer
          nullable: true
          description: >
            SSS share count. Populated for `deposit` and `inventory` (required, `2 <= k <=
            n <= 255`); `null` for `retrieval`/`removal`/`withdrawal`.
        mimeType:
          type: string
          nullable: true
          description: >
            The sender's claim about what the secret is, so the recipient can decide how to render
            it once reconstructed. Populated for `deposit` and `inventory`; `null` for
            `retrieval`/`removal`/`withdrawal`. Sender-supplied and never verified against the payload — the
            relay routes it opaquely. Unlike `sealedLabel`, it travels in the clear.
        senderSignature:
          type: string
          description: >
            Base64url digital signature by senderKey — see "Payload signatures" above.
            Set at creation, never cleared.
        recipientSignature:
          type: string
          nullable: true
          description: >
            Base64url digital signature by recipientKey — see "Payload signatures" above.
            Null while the request is pending.

    OpenShareRequestBody:
      type: object
      required: [transactionType, secretId, sealedLabel, recipientKey, secretCreatedAt, senderSignature]
      properties:
        transactionType:
          $ref: '#/components/schemas/ShareTransactionType'
        secretId:
          $ref: '#/components/schemas/SecretId'
        sealedLabel:
          type: string
          format: byte
          minLength: 1
          description: >
            Standard base64 of the label sealed to the recipient's encryption key, as for `ciphertext`.
            Required on every transaction type, because the recipient shows it.
        recipientKey:
          $ref: '#/components/schemas/PublicKey'
        secretCreatedAt:
          type: string
          format: date-time
          description: >
            Covered by `senderSignature` as epoch milliseconds, which verification re-derives
            from this string (see Timestamps above).
          example: '2026-01-01T00:00:00.123Z'
        ciphertext:
          type: string
          format: byte
          description: >
            Required for `deposit` requests: the encrypted share bytes.
            Must be omitted for `retrieval`, `removal`, `inventory` and `withdrawal` requests.
        k:
          type: integer
          description: >
            Required for `deposit` and `inventory` requests (`2 <= k <= n <= 255`,
            `400` otherwise). Must be omitted for `retrieval`/`removal`/`withdrawal`.
        n:
          type: integer
          description: >
            Required for `deposit` and `inventory` requests (`2 <= k <= n <= 255`,
            `400` otherwise). Must be omitted for `retrieval`/`removal`/`withdrawal`.
        mimeType:
          type: string
          minLength: 1
          description: >
            Required for `deposit` and `inventory` requests; must be non-blank and free of control
            characters (`400` otherwise). Must be omitted for `retrieval`/`removal`/`withdrawal`. Not validated
            against the payload — see `ShareRequest.mimeType`.
        senderSignature:
          type: string
          description: >
            Base64url digital signature by the caller over this request's canonical bytes —
            see "Payload signatures" above. Returns `400` if it doesn't verify.

    X25519PublicKey:
      type: string
      description: >
        Base64url-encoded key-agreement public key (32 bytes, no padding, for the current cipher
        suite `ed25519+x25519-v1` — see `CipherSuite`), used for share encryption client-side. The
        Web app/service never performs key agreement with it — it only ever routes it opaquely,
        same as ciphertext. Not pinned to an exact length; a future cipher suite may use a
        different key size.

    KeyRotation:
      description: >
        The signed `rotate(K_old -> K_new)` push — a holder's proactive "I am now
        newVerifyKey, previously oldVerifyKey" notice, addressed to one contact
        (`recipientKey`) at a time. Deliberately not a `ShareRequest`: it carries no `secretId`
        and has no consent phase — the recipient auto-verifies `signature` against
        `oldVerifyKey` (the trusted key it already knows this contact by) and, on success,
        updates its local contact record in place before deleting the row.
      type: object
      required: [id, oldVerifyKey, recipientKey, newVerifyKey, newEncKey, newCipherSuite, signature, createdAt]
      properties:
        id:
          type: string
          format: uuid
        oldVerifyKey:
          $ref: '#/components/schemas/PublicKey'
        recipientKey:
          $ref: '#/components/schemas/PublicKey'
        newVerifyKey:
          $ref: '#/components/schemas/PublicKey'
        newEncKey:
          $ref: '#/components/schemas/X25519PublicKey'
        newCipherSuite:
          $ref: '#/components/schemas/CipherSuite'
        signature:
          type: string
          description: >
            Base64url digital signature by oldVerifyKey — see "Payload signatures" above.
        createdAt:
          type: string
          format: date-time
          description: >
            This relay's receipt time. Unsigned, and used for expiry: a rotation nobody reads is
            deleted by the relay once this is older than its retention period, 180 days by default.
            A rotation is sent once and never again, so that contact is then relinked in person.

    PushRotationBody:
      type: object
      required: [recipientKey, newVerifyKey, newEncKey, newCipherSuite, signature]
      properties:
        recipientKey:
          $ref: '#/components/schemas/PublicKey'
        newVerifyKey:
          $ref: '#/components/schemas/PublicKey'
        newEncKey:
          $ref: '#/components/schemas/X25519PublicKey'
        newCipherSuite:
          $ref: '#/components/schemas/CipherSuite'
        signature:
          type: string
          description: >
            Base64url digital signature by the caller over this notice's canonical bytes — see
            "Payload signatures" above. Returns `400` if it doesn't verify.

    CustodyHeartbeat:
      description: >
        The signed custodial-heartbeat push — a holder's proactive "still guarding
        {secretIds} for you" notice (or, when optedOut is true, a signed "my silence from here on
        is not a loss signal" notice), addressed to one owner at a time. Deliberately not a
        `ShareRequest`/`KeyRotation`: no singular `secretId`, no consent phase. Like `KeyRotation`
        it is consumed and deleted once read; until then a newer push from the same holder to the
        same owner replaces it, under a fresh `id`.
      type: object
      required: [id, holderKey, ownerKey, secretIds, optedOut, emittedAt, signature, createdAt]
      properties:
        id:
          type: string
          format: uuid
        holderKey:
          $ref: '#/components/schemas/PublicKey'
        ownerKey:
          $ref: '#/components/schemas/PublicKey'
        secretIds:
          type: array
          items:
            type: string
            format: uuid
          description: Every secret this holder currently holds a share of for this owner.
        optedOut:
          type: boolean
          description: >
            When true, this holder has signalled it will no longer heartbeat this owner — the
            owner's app should stop treating subsequent silence from this holder as a loss signal.
        emittedAt:
          type: string
          format: date-time
          description: >
            The holder's own clock when it signed this heartbeat, covered by `signature`. The time
            the owner dates custody from.
        signature:
          type: string
          description: >
            Base64url digital signature by holderKey — see "Payload signatures" above.
        createdAt:
          type: string
          format: date-time
          description: >
            This relay's receipt time of the latest push. Unsigned, and used for expiry and by
            operators — clients date nothing by it. A heartbeat neither read nor superseded is
            deleted by the relay once this is older than its retention period, 28 days by default.

    PushHeartbeatBody:
      type: object
      required: [ownerKey, secretIds, optedOut, emittedAt, signature]
      properties:
        ownerKey:
          $ref: '#/components/schemas/PublicKey'
        secretIds:
          type: array
          items:
            type: string
            format: uuid
        optedOut:
          type: boolean
        emittedAt:
          type: string
          format: date-time
          description: >
            Covered by `signature` as epoch milliseconds, which verification re-derives from
            this string (see Timestamps above). Refused with `400` if it lies in this relay's
            future.
          example: '2026-01-02T03:04:05.678Z'
        signature:
          type: string
          description: >
            Base64url digital signature by the caller over this heartbeat's canonical bytes — see
            "Payload signatures" above. Returns `400` if it doesn't verify.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

paths:

  /share-requests:
    post:
      operationId: openShareRequest
      summary: Open a share request (deposit, retrieval, removal, inventory, or withdrawal)
      description: >
        Opens any share request type. The authenticated caller becomes `senderKey`.

        **deposit**: Sender deposits an encrypted share for the recipient. `ciphertext` and
        `k`/`n` are required. At most one non-denied deposit may exist per (secretId, recipientKey) pair.

        **retrieval / removal**: Sender opens a consent request. It carries no pointer to the
        originating deposit and needs none — the recipient finds the share by `secretId`.
        At most one pending request of each type may exist per (secretId, senderKey, recipientKey) triple.

        **inventory**: A holder pushes a metadata-only report about a share back to its
        owner. `k`/`n` are required and `ciphertext` must be omitted. Not consent-gated
        — the row is created directly in state `approved`, and there is no conflict check (a
        holder may push repeatedly; the relay stays a dumb, idempotent mailbox).

        **withdrawal**: A holder tells the owner, signed, that they have stopped holding a share.
        `ciphertext`, `k`, `n` and `mimeType` must be omitted. Created directly in state
        `approved`, with no conflict check, like inventory.
      tags: [ShareRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShareRequestBody'
      responses:
        '201':
          description: Request opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRequest'
        '400':
          description: Missing required field (e.g. ciphertext absent for deposit), or senderSignature missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: An active deposit or a pending request of this type already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >
            The request body exceeds 1 MiB, or its ciphertext exceeds 512 KiB. These are the
            relay's own storage bounds, deliberately looser than any client's own limit on the
            size of a secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: listShareRequests
      summary: List share requests visible to the caller
      description: |
        - `role=sender`    — requests the caller opened (to poll for resolution)
        - `role=recipient` — requests directed at the caller (pending approvals)

        Optionally filter by `type` and/or `state`.
      tags: [ShareRequests]
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [sender, recipient]
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ShareTransactionType'
          description: Filter to requests of this type.
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ShareRequestState'
          description: Filter to requests in this state.
      responses:
        '200':
          description: Share request list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareRequest'

  /share-requests/{requestId}:
    get:
      operationId: getShareRequest
      summary: Get a single share request
      description: >
        Accessible by both the sender and the recipient of the request.
        When a `deposit` has been approved and the ciphertext delivered, `ciphertext` is null.
        When a `retrieval` has been approved, `ciphertext` contains the share bytes until deleted.
      tags: [ShareRequests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Share request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRequest'
        '403':
          description: Caller is neither the sender nor the recipient of this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      operationId: respondToShareRequest
      summary: Approve or deny a pending share request (recipient only)
      description: >
        Called by the recipient to approve or deny a pending request.

        - Approving a `deposit`: the relay delivers `ciphertext` to the recipient in the response body
          and clears it from the relay (one-time delivery). No `ciphertext` needed in the request body.
        - Approving a `retrieval`: the recipient must supply `ciphertext` (the share bytes from their
          local storage) in the request body. Returns `400` if absent.
        - Approving a `removal`: the relay sweeps all *other* rows for the same
          (secretId, senderKey, recipientKey) triple — the `deposit` above all, which may still hold
          ciphertext for a share that no longer exists. The answered `removal` row itself is kept,
          signed, because it is the only way the sender learns the destruction happened; a row that
          is merely gone means "collected, or never sent". The sender deletes it once she has read
          it. No `ciphertext` involved.
        - Any denial: records `state=denied` and `respondedAt`. No ciphertext exchanged.
      tags: [ShareRequests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, recipientSignature]
              properties:
                state:
                  type: string
                  enum: [approved, denied]
                ciphertext:
                  type: string
                  format: byte
                  description: Required when approving a `retrieval` request.
                recipientSignature:
                  type: string
                  description: >
                    Base64url digital signature by the caller over this response's canonical
                    bytes — see "Payload signatures" above. Required unconditionally, including
                    denials. Returns `400` if it doesn't verify.
      responses:
        '200':
          description: Decision recorded. For `deposit` approval, includes `ciphertext`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRequest'
        '400':
          description: Ciphertext required (retrieval approval) but absent, or recipientSignature missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not the recipient of this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: >
            The request body exceeds 1 MiB, or the ciphertext supplied with a retrieval approval
            exceeds 512 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteShareRequest
      summary: Delete a single share request
      description: >
        Accessible by both the sender and the recipient. Deletes that row and nothing else: a
        sender deletes an approved `deposit` as soon as she has seen the pickup, and a `retrieval`
        or `removal` she opened in the meantime must not go with it.
      tags: [ShareRequests]
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Request row deleted.
        '403':
          description: Caller is neither the sender nor the recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /key-rotations:
    post:
      operationId: pushRotation
      summary: Push a signed key-rotation notice to one contact
      description: >
        The authenticated caller becomes `oldVerifyKey`. Not consent-gated and no conflict check
        — a fire-and-forget push, the same shape as `inventory`: the recipient
        polls, auto-verifies, and deletes the row once consumed.
      tags: [KeyRotations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRotationBody'
      responses:
        '201':
          description: Notice pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyRotation'
        '400':
          description: Missing/invalid field, or signature missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: listRotations
      summary: List rotation notices addressed to the caller
      tags: [KeyRotations]
      responses:
        '200':
          description: Rotation notice list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyRotation'

  /key-rotations/{id}:
    delete:
      operationId: deleteRotation
      summary: Delete a rotation notice once consumed
      description: >
        Only the recipient may delete it — unlike `ShareRequest` rows, there's no sender-side
        reason to read one back.
      tags: [KeyRotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Notice deleted.
        '403':
          description: Caller is not the recipient of this notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notice not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /custody-heartbeats:
    post:
      operationId: pushHeartbeat
      summary: Push (upsert) a signed custodial-heartbeat for one owner
      description: >
        The authenticated caller becomes `holderKey`. Not consent-gated and no conflict check —
        a fire-and-forget push, the same shape as `inventory`/`key-rotations`, consumed and
        deleted by the owner once read. Until then this upserts by `(holderKey, ownerKey)`,
        replacing an unread heartbeat from the same holder to the same owner rather than
        accumulating, under a fresh `id`. `emittedAt` must be signed and must not lie in this
        relay's future.
      tags: [CustodyHeartbeats]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushHeartbeatBody'
      responses:
        '201':
          description: Heartbeat pushed (created or updated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyHeartbeat'
        '400':
          description: Missing/invalid field, or signature missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      operationId: listHeartbeats
      summary: List the unread heartbeat from each holder addressed to the caller
      tags: [CustodyHeartbeats]
      responses:
        '200':
          description: Heartbeat list, one entry per distinct holder.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustodyHeartbeat'

  /custody-heartbeats/{id}:
    delete:
      operationId: deleteHeartbeat
      summary: Delete a heartbeat once read
      description: >
        Only the owner it is addressed to may delete it. A newer push from the same holder
        replaces an unread heartbeat under a fresh `id`, so deleting the `id` that was read never
        reaches one that was not.
      tags: [CustodyHeartbeats]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Heartbeat deleted.
        '403':
          description: Caller is not the owner this heartbeat is addressed to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Heartbeat not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
